global:
  environment: dev

images:
  storeFront:
    repository: ghcr.io/chriskealerant/kargo-demo-store-front
    tag: v2.2.1
  productService:
    repository: ghcr.io/chriskealerant/kargo-demo-product-service
    tag: v2.3.0
  orderService:
    repository: ghcr.io/chriskealerant/kargo-demo-order-service
    tag: v2.0.1

replicaCount:
  storeFront: 1
  productService: 1
  orderService: 1

dependencies:
  mongodb:
    enabled: true
    image: mongo:7
  rabbitmq:
    enabled: true
    image: rabbitmq:3-management
